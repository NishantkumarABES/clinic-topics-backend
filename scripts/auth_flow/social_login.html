<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Social Login API Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      padding: 30px;
    }
    h2 {
      margin-top: 40px;
    }
    button {
      padding: 10px 16px;
      margin: 8px 0;
      cursor: pointer;
    }
    select, input {
      padding: 8px;
      margin: 6px 0;
      width: 300px;
      display: block;
    }
    pre {
      background: #111827;
      color: #d1d5db;
      padding: 12px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<h1>Social Login / Register Test</h1>

<label>
  Select Role (for Register):
  <select id="role">
    <option value="patient">Patient</option>
    <option value="doctor">Doctor</option>
  </select>
</label>

<hr />

<h2>Google</h2>

<button onclick="setGoogleMode('register')">Google Register</button>
<button onclick="setGoogleMode('login')">Google Login</button>

<div id="google-button"></div>

<hr />

<h2>Apple Login / Register (Manual Token)</h2>
<p>
  Apple Sign-In requires HTTPS and Apple Developer config.
  For backend testing, paste a valid Apple identity token below.
</p>

<input id="apple-token" placeholder="Paste Apple identity token" />

<button onclick="appleRegister()">Apple Register</button>
<button onclick="appleLogin()">Apple Login</button>

<h2>API Response</h2>
<pre id="output"></pre>

<script>
/* ================= CONFIG ================= */

// const BASE_URL = "http://clinic-topics-backend.onrender.com/api/v1";
const BASE_URL = "http://localhost:8000/api/v1";
const GOOGLE_CLIENT_ID = "539182370618-kihl7enlmd76ug9vgmns03k0m0im9229.apps.googleusercontent.com";

/* Track intent */
let GOOGLE_MODE = "register";

/* ================= HELPERS ================= */

function logOutput(data) {
  document.getElementById("output").textContent =
    typeof data === "string" ? data : JSON.stringify(data, null, 2);
}

function setGoogleMode(mode) {
  GOOGLE_MODE = mode;
  console.log("Google mode set to:", mode);
  google.accounts.id.prompt(); // open Google popup
}

/* ================= GOOGLE INIT ================= */

window.onload = () => {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleResponse,
  });

  google.accounts.id.renderButton(
    document.getElementById("google-button"),
    { theme: "outline", size: "large" }
  );
};

/* ================= GOOGLE ROUTER ================= */

async function handleGoogleResponse(response) {
  if (!response || !response.credential) {
    return logOutput("No credential received from Google");
  }

  if (GOOGLE_MODE === "register") {
    await handleGoogleRegister(response);
  } else {
    await handleGoogleLogin(response);
  }
}

/* ================= REGISTER ================= */

async function handleGoogleRegister(response) {
  console.log("Inside GOOGLE REGISTER");

  const role = document.getElementById("role").value;

  const payload = {
    via_social: true,
    provider: "google",
    token: response.credential,

    /* sample user data for testing */
    full_name: "Thomas Bunt",
    email: "nishant@gmail.com",
    phone: "7234390482",
    country_code: "+91",
    password: "#dW5SnlON4",
    terms_accepted: true,
    date_of_birth: "1941-04-09",
    gender: "male",
    is_email_verified: true,
    is_phone_verified: false
  };

  const res = await fetch(
    `${BASE_URL}/auth/register/${role}/`,
    {
      method: "POST",
      headers: { "Content-Type": "multipart/form-data" },
      body: JSON.stringify(payload),
    }
  );

  logOutput(await res.json());
}

/* ================= LOGIN ================= */

async function handleGoogleLogin(response) {
  console.log("Inside GOOGLE LOGIN");

  const payload = {
    provider: "google",
    token: response.credential,
    remember_me: true,
  };

  const res = await fetch(
    `${BASE_URL}/auth/login/social/`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }
  );

  logOutput(await res.json());
}

/* ================= APPLE (MANUAL) ================= */

async function appleRegister() {
  const token = document.getElementById("apple-token").value;
  const role = document.getElementById("role").value;

  if (!token) return alert("Paste Apple token first");

  const payload = {
    via_social: true,
    provider: "apple",
    token: token,
  };

  const res = await fetch(
    `${BASE_URL}/auth/register/${role}/`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }
  );

  logOutput(await res.json());
}

async function appleLogin() {
  const token = document.getElementById("apple-token").value;

  if (!token) return alert("Paste Apple token first");

  const payload = {
    provider: "apple",
    token: token,
    remember_me: true,
  };

  const res = await fetch(
    `${BASE_URL}/auth/login/social/`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }
  );

  logOutput(await res.json());
}
</script>

</body>
</html>
